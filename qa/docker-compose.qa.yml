services:
  credential-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        target=/secrets/validator-credentials.json
        token() { od -An -N32 -tx1 /dev/urandom | tr -d ' \n'; }
        if [ ! -s "$$target" ]; then
          printf '{"VAL_500T_01":"%s","VAL_14ES_01":"%s","VAL_T1_01":"%s","VAL_VAPUR_01":"%s"}\n' "$$(token)" "$$(token)" "$$(token)" "$$(token)" > "$$target"
          chmod 0444 "$$target"
        fi
        test -s "$$target"
    volumes:
      - qa_validator_credentials:/secrets

  simulator-storage-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    command: ["/bin/sh", "-ec", "chown -R 10001:10001 /data && chmod 0700 /data"]
    volumes:
      - qa_simulator_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aktarbilet_qa
      POSTGRES_USER: aktarbilet_qa
      POSTGRES_PASSWORD: qa-local-only
    volumes:
      - qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aktarbilet_qa -d aktarbilet_qa"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      qa-net:
        aliases:
          - "${COMPOSE_PROJECT_NAME:-aktarbilet-qa}-postgres"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://aktarbilet_qa:qa-local-only@${COMPOSE_PROJECT_NAME:-aktarbilet-qa}-postgres:5432/aktarbilet_qa?sslmode=disable"
      JWT_SECRET: "qa-only-jwt-secret-at-least-thirty-two-bytes"
      DDO_STAMP: "f85f26"
      ENVIRONMENT: "qa"
      VALIDATOR_CREDENTIALS_FILE: /run/aktarbilet-secrets/validator-credentials.json
    volumes:
      - qa_validator_credentials:/run/aktarbilet-secrets:ro
    ports:
      - "127.0.0.1:${QA_BACKEND_PORT:-18080}:8080"
    depends_on:
      credential-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      qa-net:
        aliases:
          - "${COMPOSE_PROJECT_NAME:-aktarbilet-qa}-backend"

  frontend:
    build:
      context: ..
      dockerfile: qa/Dockerfile.frontend.qa
      args:
        QA_BACKEND_HOST: "${COMPOSE_PROJECT_NAME:-aktarbilet-qa}-backend"
    ports:
      - "127.0.0.1:${QA_FRONTEND_PORT:-13000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # The shipped image check uses localhost, which resolves to ::1 in Alpine
      # while nginx listens on IPv4 only. Keep the production defect visible in
      # the audit and use an explicit IPv4 target solely for QA orchestration.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - qa-net

  simulator:
    build:
      context: ..
      dockerfile: Dockerfile.simulator
    environment:
      BACKEND_URL: "http://${COMPOSE_PROJECT_NAME:-aktarbilet-qa}-backend:8080"
      VALIDATOR_CREDENTIALS_FILE: /run/aktarbilet-secrets/validator-credentials.json
      SIMULATOR_WAL_PATH: "/var/lib/aktarbilet-simulator/simulator_wal.jsonl"
      SIMULATOR_SEQ_PATH: "/var/lib/aktarbilet-simulator/simulator_seq.json"
      SIMULATOR_MANIFEST_PATH: "/var/lib/aktarbilet-simulator/simulator_manifest.json"
    volumes:
      - qa_simulator_data:/var/lib/aktarbilet-simulator
      - qa_validator_credentials:/run/aktarbilet-secrets:ro
    depends_on:
      credential-init:
        condition: service_completed_successfully
      simulator-storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    profiles: ["simulator"]
    networks:
      qa-net:
        aliases:
          - "${COMPOSE_PROJECT_NAME:-aktarbilet-qa}-simulator"

volumes:
  qa_postgres_data:
  qa_simulator_data:
  qa_validator_credentials:

networks:
  qa-net:
    driver: bridge
    name: ${QA_NETWORK_NAME:-${COMPOSE_PROJECT_NAME:-aktarbilet-qa}_qa-net}
  # Helper/init containers do not need service discovery. Avoid allocating an
  # implicit per-project subnet when Docker's address pools are exhausted.
  default:
    name: bridge
    external: true
