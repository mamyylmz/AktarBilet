services:
  infra-init:
    image: alpine:3.20
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        target=/secrets/validator-credentials.json
        token() { od -An -N32 -tx1 /dev/urandom | tr -d ' \n'; }
        if [ ! -s "$$target" ]; then
          printf '{"VAL_500T_01":"%s","VAL_14ES_01":"%s","VAL_T1_01":"%s","VAL_VAPUR_01":"%s"}\n' "$$(token)" "$$(token)" "$$(token)" "$$(token)" > "$$target"
          chmod 0444 "$$target"
        fi
        test -s "$$target"
        chown -R 10001:10001 /data && chmod 0700 /data
    volumes:
      - validator_credentials:/secrets
      - simulator_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: ddo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aktarbilet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aktarbilet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aktarbilet-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ddo-pelikan-api # ZORUNLU SİSTEM CANARY CONTAINER ADI
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aktarbilet}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-ddo-aktarbilet-super-secret-key-2026}
      DDO_STAMP: "f85f26"
      VALIDATOR_CREDENTIALS_FILE: /run/aktarbilet-secrets/validator-credentials.json
    volumes:
      - validator_credentials:/run/aktarbilet-secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      infra-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aktarbilet-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ddo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - aktarbilet-net

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: ddo-simulator
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:8080"
      VALIDATOR_CREDENTIALS_FILE: /run/aktarbilet-secrets/validator-credentials.json
      SIMULATOR_WAL_PATH: "/var/lib/aktarbilet-simulator/simulator_wal.jsonl"
      SIMULATOR_SEQ_PATH: "/var/lib/aktarbilet-simulator/simulator_seq.json"
      SIMULATOR_MANIFEST_PATH: "/var/lib/aktarbilet-simulator/simulator_manifest.json"
    volumes:
      - simulator_data:/var/lib/aktarbilet-simulator
      - validator_credentials:/run/aktarbilet-secrets:ro
    profiles:
      - simulator
    depends_on:
      infra-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - aktarbilet-net

  verify:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ddo-verify
    entrypoint: ["/app/verify"]
    environment:
      BACKEND_URL: "http://backend:8080"
      VALIDATOR_CREDENTIALS_FILE: /run/aktarbilet-secrets/validator-credentials.json
    volumes:
      - validator_credentials:/run/aktarbilet-secrets:ro
    profiles:
      - verify
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aktarbilet-net

volumes:
  postgres_data:
  simulator_data:
  validator_credentials:

networks:
  aktarbilet-net:
    driver: bridge
