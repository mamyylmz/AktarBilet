name: AktarBilet CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend Testleri, Kapsam ve Doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aktarbilet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Go Ortamını Kur
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Go Bağımlılıklarını İndir
        run: go mod download

      - name: Go Statik Analiz (Vet & Format)
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (echo "Formatlanmamış dosyalar mevcut:" && gofmt -l . && exit 1)

      - name: Validatör Test Kimliklerini Hazırla
        run: |
          mkdir -p /tmp/aktarbilet-secrets
          cat << 'EOF' > /tmp/aktarbilet-secrets/validator-credentials.json
          {
            "VAL_500T_01": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
            "VAL_14ES_01": "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789",
            "VAL_T1_01": "1111222233334444555566667777888811112222333344445555666677778888",
            "VAL_VAPUR_01": "aaaabbbbccccddddeeeeffff00001111aaaabbbbccccddddeeeeffff00001111"
          }
          EOF

      - name: Veritabanı Şeması ve Başlangıç Tohumunu Başlat (reset-demo)
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/aktarbilet?sslmode=disable"
          JWT_SECRET: "ddo-aktarbilet-super-secret-key-2026"
          DDO_STAMP: "f85f26"
          VALIDATOR_CREDENTIALS_FILE: "/tmp/aktarbilet-secrets/validator-credentials.json"
        run: |
          go run ./cmd/server -reset

      - name: Kapsamlı Birim ve Entegrasyon Testleri (Coverage Gate >= 70%)
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/aktarbilet?sslmode=disable"
          JWT_SECRET: "ddo-aktarbilet-super-secret-key-2026"
          DDO_STAMP: "f85f26"
          VALIDATOR_CREDENTIALS_FILE: "/tmp/aktarbilet-secrets/validator-credentials.json"
        run: |
          go test -v -race -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Toplam İfade Kapsamı: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70.0) { print "HATA: Test kapsamı %70 eşiğinin altında!"; exit 1 } else { print "BAŞARILI: Test kapsamı eşiği karşılandı." } }'

      - name: Hızlı Doğrulama Komutu (make verify)
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/aktarbilet?sslmode=disable"
          JWT_SECRET: "ddo-aktarbilet-super-secret-key-2026"
          DDO_STAMP: "f85f26"
          VALIDATOR_CREDENTIALS_FILE: "/tmp/aktarbilet-secrets/validator-credentials.json"
        run: |
          go run ./cmd/server &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "Backend sunucusu hazır!"
              break
            fi
            sleep 1
          done
          make verify
          kill $SERVER_PID || true

  frontend-build:
    name: Frontend Derleme ve Tip Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Bağımlılıkları Yükle ve Derle
        run: |
          cd web
          npm install
          npm run build

  container-build:
    name: Docker Konteyner İmajları Derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: Backend İmajını Derle (ddo-pelikan-api)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: ddo-pelikan-api:latest

      - name: Frontend İmajını Derle
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: ddo-frontend:latest

      - name: Simülatör İmajını Derle
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.simulator
          push: false
          tags: ddo-simulator:latest
